<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Оформление заявки на покупку кубика Рубика.">
  <title>Оформление заказа — CubeMaster</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">CubeMaster</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link site-nav__link--active" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="index.html#about">О нас</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="index.html#advantages">Преимущества</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <span class="breadcrumbs__current">Оформление заказа</span>
    </nav>

    <section class="section">
      <div class="section__inner">
        <h1 class="section__title">Оформление заявки</h1>
        <form class="order-form" action="#" method="post">
          <fieldset class="order-form__fieldset">
            <legend class="order-form__legend">Данные покупателя</legend>
            <div class="order-form__field">
              <label class="order-form__label" for="order-name">Ваше имя</label>
              <input class="order-form__input" id="order-name" name="name" type="text" required>
            </div>
            <div class="order-form__field">
              <label class="order-form__label" for="order-email">E-mail</label>
              <input class="order-form__input" id="order-email" name="email" type="email" required>
            </div>
            <div class="order-form__field">
              <label class="order-form__label" for="order-phone">Телефон</label>
              <input class="order-form__input" id="order-phone" name="phone" type="tel" required>
            </div>
          </fieldset>

          <fieldset class="order-form__fieldset">
            <legend class="order-form__legend">Комментарий к заказу</legend>
            <div class="order-form__field">
              <label class="order-form__label" for="order-comment">Сообщение</label>
              <textarea class="order-form__input order-form__textarea" id="order-comment" name="comment" rows="4" placeholder="Например: модель кубика, цвет, способ доставки"></textarea>
            </div>
          </fieldset>

          <label class="order-form__checkbox">
            <input type="checkbox" name="agree" required>
            Согласен на обработку персональных данных
          </label>

          <button class="button button--primary" type="submit">Подтвердить заказ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <nav class="site-footer__nav" aria-label="Служебная навигация">
        <a class="site-footer__link" href="index.html#about">О нас</a>
        <a class="site-footer__link" href="index.html#catalog">Каталог товаров</a>
        <a class="site-footer__link" href="index.html#advantages">Преимущества</a>
        <a class="site-footer__link" href="contacts.html#contacts">Контакты</a>
      </nav>
      <p class="site-footer__text">&copy; 2026 Учебный проект. Все права защищены.</p>
      <p class="site-footer__text">Дисциплина: Фронтенд и бэкенд разработка</p>
    </div>
  </footer>
</body>
</html>
