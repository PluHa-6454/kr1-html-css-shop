<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Оформление заказа на покупку товара.">
  <title>Оформление заказа — ShopProject</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">ShopProject</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <span class="breadcrumbs__current">Оформление заказа</span>
    </nav>

    <section class="section">
      <div class="section__inner">
        <h1 class="section__title">Оформление заявки</h1>
        <form class="order-form" action="#" method="post" style="max-width: 500px;">
          <div class="order-form__field">
            <label class="order-form__label" for="page-order-name">Ваше имя</label>
            <input class="order-form__input" id="page-order-name" name="name" type="text" required>
          </div>

          <div class="order-form__field">
            <label class="order-form__label" for="page-order-email">E-mail</label>
            <input class="order-form__input" id="page-order-email" name="email" type="email" required>
          </div>

          <div class="order-form__field">
            <label class="order-form__label" for="page-order-phone">Телефон</label>
            <input class="order-form__input" id="page-order-phone" name="phone" type="tel" required>
          </div>

          <button class="button button--primary" type="submit">Подтвердить заказ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="site-footer__text">&copy; 2026 Учебный проект. Все права защищены.</p>
    </div>
  </footer>
</body>
</html>
